name: painel

on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - ".github/workflows/painel.yml"
  pull_request:
    paths:
      - "painel/**"
      - ".github/workflows/painel.yml"

concurrency:
  group: painel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: painel
    env:
      # Com CI definido, o Playwright faz build de produção, não reaproveita servidor, roda com um
      # worker e tenta de novo duas vezes. O E2E fala com o simulador de API, sem backend.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: painel/.nvmrc
          cache: npm
          cache-dependency-path: painel/package-lock.json

      - run: npm ci

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint, tipos, Vitest e Playwright
        run: npm run verify

      - name: Rastros do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: painel/test-results
          retention-days: 7
