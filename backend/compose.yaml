services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.11.10'
    environment:
      - 'TZ=UTC'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      - 'TZ=UTC'
      - 'PGTZ=UTC'
    ports:
      - '5432'
