# Stack de produção do pitaco (homelab).
#
# Serviços privados (postgres) vivem só na rede "internal".
# api e painel também entram na rede "edge", compartilhada com o stack
# ~/apps/infra (cloudflared + lgtm), e é lá que o túnel os encontra pelos
# aliases pitaco-api e pitaco-painel.
#
# Nenhum serviço publica porta no host: o único caminho de entrada é o túnel.
# Para desenvolvimento local, use backend/compose.yaml.
name: pitaco

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Sem SPRING_PROFILES_ACTIVE: carrega só o application.yml, que já é o
      # padrão de produção. O application-local.yml nem chega a ser lido.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Um endereço para os três sinais. O Spring Boot 4 mapeia esta variável
      # do SDK do OpenTelemetry para as três propriedades de exportação —
      # traces, logs e o OtlpMeterRegistry do Micrometer — acrescentando
      # /v1/traces, /v1/logs e /v1/metrics.
      #
      # Não use MANAGEMENT_OPENTELEMETRY_OTLP_ENDPOINT: essa propriedade não
      # existe no Boot 4 e é ignorada em silêncio. Sem endpoint, o exportador
      # de trace e o de log nem chegam a ser criados (@ConditionalOnProperty),
      # e só a métrica continua saindo.
      #
      # 4318 é OTLP sobre HTTP; 4317 seria gRPC.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      edge:
        # Nome que o túnel usa. Um "api" genérico colidiria com o próximo
        # projeto que também tiver um na mesma rede compartilhada.
        aliases: [pitaco-api]

  painel:
    build:
      context: ./painel
    restart: unless-stopped
    environment:
      # O painel só fala com a api por dentro da rede internal, pelo nome do
      # serviço. /api é o context-path do backend.
      PITACO_API_URL: http://api:8080/api
    depends_on:
      - api
    networks:
      internal:
      edge:
        aliases: [pitaco-painel]

volumes:
  pg_data:

networks:
  internal:
  edge:
    # Criada uma vez na máquina: docker network create edge
    external: true
