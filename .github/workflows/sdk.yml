name: SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-sdk:
    name: Verify SDK and Example
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sdk/package.json'

      - name: Install dependencies
        run: |
          cd sdk
          npm install

      - name: Run SDK Verify
        run: |
          cd sdk
          npm run verify

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sdk/package.json'

      - name: Install dependencies
        run: |
          cd sdk
          npm install

      - name: Run Catalog Contract Test
        run: |
          cd sdk
          npm run test -- src/catalog/__tests__/contract.test.ts

  expo-export:
    name: Expo Export Example
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sdk/example/package.json'

      - name: Install dependencies
        run: |
          cd sdk
          npm install
          cd example
          npm install

      - name: Expo Export Android and iOS
        run: |
          cd sdk/example
          npx expo export -p ios
          npx expo export -p android
