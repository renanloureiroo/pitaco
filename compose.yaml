# Stack de produção auto-hospedada do Pitaco.
#
# Serviços privados (postgres) vivem só na rede "internal".
# api e painel também entram na rede "edge", compartilhada com o túnel reverso (ex.: Cloudflare
# Tunnel) e com a stack de observabilidade (Grafana LGTM), que os encontram pelos aliases
# pitaco-api e pitaco-painel.
#
# Nenhum serviço publica porta no host: o único caminho de entrada é o túnel. Para rodar a stack
# completa na sua máquina, com portas publicadas e sem túnel:
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
# Para desenvolver o backend, use backend/compose.yaml (sobe junto com ./mvnw spring-boot:run).
name: pitaco

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sem core dump: cada queda do Postgres grava ~150 MB na pasta de dados e, com o restart
    # automático, quedas em laço enchem o disco do servidor.
    ulimits:
      core: 0
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Sem SPRING_PROFILES_ACTIVE: carrega só o application.yml, que já é o
      # padrão de produção. O application-local.yml nem chega a ser lido.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Um endereço para os três sinais. O Spring Boot 4 mapeia esta variável
      # do SDK do OpenTelemetry para as três propriedades de exportação —
      # traces, logs e o OtlpMeterRegistry do Micrometer — acrescentando
      # /v1/traces, /v1/logs e /v1/metrics.
      #
      # Não use MANAGEMENT_OPENTELEMETRY_OTLP_ENDPOINT: essa propriedade não
      # existe no Boot 4 e é ignorada em silêncio. Sem endpoint, o exportador
      # de trace e o de log nem chegam a ser criados (@ConditionalOnProperty),
      # e só a métrica continua saindo.
      #
      # 4318 é OTLP sobre HTTP; 4317 seria gRPC.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # Swagger UI e /v3/api-docs nascem desligados: /api passa pelo túnel sem Access, e
      # ligados expõem o mapa inteiro da API. Para ligar de propósito:
      # PITACO_API_DOCS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      edge:
        # Nome que o túnel usa. Um "api" genérico colidiria com o próximo
        # projeto que também tiver um na mesma rede compartilhada.
        aliases: [pitaco-api]

  painel:
    build:
      context: .
      dockerfile: painel/Dockerfile
    restart: unless-stopped
    environment:
      # O painel só fala com a api por dentro da rede internal, pelo nome do
      # serviço. /api é o context-path do backend.
      PITACO_API_URL: http://api:8080/api
      PORT: 3001
    depends_on:
      - api
    networks:
      internal:
      edge:
        aliases: [pitaco-painel]

  # pg_dump diário para object storage fora desta máquina: backup que mora no mesmo servidor não
  # é backup. Só na rede internal; a saída para a internet é a do bridge padrão. O restore e o
  # ensaio de restore estão em ops/RUNBOOK.md.
  #
  # Opcional: só sobe com o perfil, depois de preencher BACKUP_REMOTE e RCLONE_CONFIG_* no .env.
  # Sem destino o script sai com erro, e o restart automático entraria em laço.
  #   docker compose --profile backup up -d
  backup:
    profiles: [backup]
    build:
      context: ./ops/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      # O remoto "pitacobackup" do rclone, definido só por ambiente. S3 e compatíveis (B2, R2,
      # MinIO): troque PROVIDER e ENDPOINT conforme o provedor.
      RCLONE_CONFIG_PITACOBACKUP_TYPE: ${RCLONE_CONFIG_PITACOBACKUP_TYPE:-s3}
      RCLONE_CONFIG_PITACOBACKUP_PROVIDER: ${RCLONE_CONFIG_PITACOBACKUP_PROVIDER:-Other}
      RCLONE_CONFIG_PITACOBACKUP_ACCESS_KEY_ID: ${RCLONE_CONFIG_PITACOBACKUP_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_PITACOBACKUP_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_PITACOBACKUP_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_PITACOBACKUP_ENDPOINT: ${RCLONE_CONFIG_PITACOBACKUP_ENDPOINT:-}
      RCLONE_CONFIG_PITACOBACKUP_REGION: ${RCLONE_CONFIG_PITACOBACKUP_REGION:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  pg_data:

networks:
  internal:
  edge:
    # Criada uma vez na máquina: docker network create edge
    external: true
