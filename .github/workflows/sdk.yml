name: sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      # React Native 0.87 e o Metro exigem Node 22.13 ou mais novo.
      - uses: actions/setup-node@v4
        with:
          node-version-file: painel/.nvmrc
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/example/package-lock.json

      - name: Dependências do SDK e do exemplo
        run: |
          npm ci
          npm ci --prefix example

      # Lint, tipos, Jest (inclui o teste de contrato do catálogo contra o OpenAPI), build do bob e
      # lint/tipos do app de exemplo.
      - name: Lint, tipos, testes e build
        run: npm run verify

  expo-export:
    name: expo export (exemplo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: painel/.nvmrc
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/example/package-lock.json

      - name: Dependências
        run: |
          npm ci --prefix ..
          npm ci

      - name: Bundle iOS e Android
        run: |
          npx expo export -p ios --output-dir dist-ios
          npx expo export -p android --output-dir dist-android
