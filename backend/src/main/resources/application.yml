server:
  servlet:
    # Prefixo de tudo que a aplicação expõe — API, Swagger UI e Actuator.
    context-path: /api
  # O túnel termina o TLS e fala HTTP com o container: sem isto a aplicação se
  # enxerga em http e monta URL errada em tudo que deriva da requisição — o
  # `servers` do OpenAPI e o header `Location` do 201. `framework` (o
  # ForwardedHeaderFilter) em vez de `native` porque nenhuma porta é publicada
  # no host: o único caminho de entrada é o cloudflared, então não há de onde
  # chegar um X-Forwarded-Proto forjado, e não se depende do IP do proxy cair
  # na faixa que o RemoteIpValve considera interna.
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      # Uma linha por requisição, incluindo as que morrem antes do controller
      # (404, 405, payload malformado). O log da aplicação começa no use case;
      # esta é a única camada que enxerga o que nunca chegou lá.
      enabled: true
      # Vai para o stdout do processo, junto do resto do log — nada de arquivo
      # em disco para rotacionar ou esquecer no container.
      directory: /dev
      prefix: stdout
      suffix: ""
      rotate: false
      buffered: false
      # %r = método, URI e protocolo; %s = status; %b = bytes no corpo;
      # %{ms}T = duração com a unidade explícita (%D varia entre Tomcat e httpd).
      pattern: '%t "%r" %s %b %{ms}Tms'

spring:
  application:
    name: pitaco
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # Este arquivo é o padrão de produção, onde não existe compose ao lado do
      # jar. O profile local religa.
      enabled: false
  datasource:
    hikari:
      # Notebook antigo: pool pequeno é mais saudável que pool grande e ocioso.
      maximum-pool-size: 10
  jpa:
    hibernate:
      # O schema nasce da migration: aqui o Hibernate apenas confere se as
      # entidades e as tabelas concordam, e falha no start quando divergem.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Grava e lê todo timestamp em UTC, independente do fuso da JVM: o
          # mesmo instante precisa dar a mesma linha em qualquer máquina.
          time_zone: UTC

pitaco:
  collect:
    # Prazo após o qual a exibição sem desfecho é considerada abandonada. Trinta minutos cobre
    # quem trocou de tela e voltou; abandono nunca é gravado, é derivado na leitura.
    display-timeout: 30m
    # Abandonos no mesmo grupo de comparabilidade antes de parar de entregar a pesquisa.
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        # Só o necessário para saber se o processo está de pé. Cada endpoint a
        # mais aqui é superfície exposta atrás de um túnel público.
        include: health,info
  tracing:
    sampling:
      # 100%. Amostrar num homelab é contraproducente: com dezenas de
      # requisições por dia, 10% significa quase nenhum trace registrado.
      # Reduzir só quando houver volume que justifique.
      probability: 1.0

springdoc:
  # TEMPORÁRIO: ligado também em produção enquanto a API está em construção.
  # Como /api tem policy de Bypass no Cloudflare Access, isto deixa o mapa
  # inteiro da API público em pitaco.renanloureiro.me/api/swagger-ui.html.
  # Desligar aqui (ou proteger o path no Access) antes de haver dado real.
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false

logging:
  level:
    com.renanloureiroo.pitaco: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: error
    org.springdoc.core.utils.SpringDocUtils: error
